<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Java Edition 1.20 – Hosted by a Mozilla License</title>
<link href="/icon/favicon.ico" rel="icon" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= VARIABLES ================= */
:root {
  --accent: #2ecc71;
  --frame-max-width: 900px;
  --frame-aspect-ratio: 900 / 700; /* width / height */
}

/* ================= RESET ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ================= BODY ================= */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: linear-gradient(135deg, #1b2a3a, #0b0f14);
  color: #e5e7eb;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  overflow-x: hidden;
}

/* ================= HEADER ================= */
.header {
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 20px;
  max-width: var(--frame-max-width);
}

/* ================= FRAME ================= */
.gmv-frame {
  width: 100%;
  max-width: var(--frame-max-width);
  aspect-ratio: var(--frame-aspect-ratio);
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;

  box-shadow:
    0 30px 70px rgba(0, 0, 0, 0.85),
    inset 0 0 0 2px rgba(46, 204, 113, 0.25);
}

.gmv-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ================= FOOTER ================= */
.footer {
  max-width: var(--frame-max-width);
  margin-top: 15px;
  font-size: 12px;
  color: #9ca3af;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.footer span {
  color: var(--accent);
  font-weight: 500;
}

/* ================= OPTIONAL PLAY BUTTON ================= */
.gmv-frame::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--accent);
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0.3;
  transition: opacity 0.3s;
}

.gmv-frame:hover::before {
  opacity: 0;
}

</style>
</head>

<body>

<div class="header">
  Minecraft Java Edition 1.20 - Hosted by a Mozilla License
</div>

<div class="gmv-frame">
  <iframe
    src="https://mcraft.fun/"
    title="Minecraft Java Edition 1.20">
    Your browser does not support iframes.
  </iframe>
</div>

<div class="footer">
  <div>© 2017-2026 UserArham and Eaglercraft</div>
  
  <div><span>Resources copyright Mojang AB</span></div>
</div>

</body>
</html>
